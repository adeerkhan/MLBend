[project]
name = "mlbend"
version = "0.1.0"
description = "Machine learning for Bend 2, in the shape scikit-learn has."

[dependencies]
bend-ml-autograd = "*"
bend-ml-bpe-tokenizer = "*"
bend-ml-tensor = "0.1.0.0"
bend-ml-tensor-array = "*"
bend-ml-tensor-fork = "*"
bendtorch-core = "0.1.0.0"

[workspace]
members = [
    "metrics",
    "hf",
    "datasets",
    "preprocess",
    "split",
]

[workspace.dependencies]
bend-kit-random = "0.1.0.1"
bend-ml-autograd = "0.1.1.0"
bend-ml-nat-lemmas = "0.1.1.0"
bend-ml-tensor-array = "0.1.14.0"
bendtorch-core = "0.1.0.0"
